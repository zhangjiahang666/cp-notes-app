  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}

  .dl small{display:block;font-weight:400;font-size:12px;opacity:.8;margin-top:2px;}
  .link{text-align:center;font-size:14px;color:var(--muted);}
  .link a{color:var(--accent);text-decoration:none;}
  .link a:hover{text-decoration:underline;}
  .meta{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.8;}
