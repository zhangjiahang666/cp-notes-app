name: Build App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'package.json'
      - 'build/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: '--win portable'
            name: windows
          - os: ubuntu-latest
            target: '--linux AppImage'
            name: linux
          - os: macos-latest
            target: '--mac dmg'
            name: macos
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: C++ 笔记 最新版
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
